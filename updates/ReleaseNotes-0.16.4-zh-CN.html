<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>DeskNest 0.16.4</title>
<h1>DeskNest 0.16.4</h1>
<p>更新通道：stable；构建版本：0.16.4.65535；Windows x64。</p>
<ul><li>新增 Box 统一背景：标题、标签与内容共用材质；单个 Box 和设置中心同步支持，旧外观保持不变。</li>
<li>统一标题栏右键与三个点菜单，区分当前 Box 和全局操作，整理外观常用与高级选项。</li>
<li>修复 Windows 布局覆盖 Box 排列密度，以及菜单打开期间 Box 重建导致的闪退。</li>
<li>改善大型映射目录扫描性能，修正 Mica 不透明度、圆角和中转站位置漂移。</li>
<li>保留旧配置、实时预览取消回滚及文件安全边界；中转站仍默认关闭。</li></ul></html>
