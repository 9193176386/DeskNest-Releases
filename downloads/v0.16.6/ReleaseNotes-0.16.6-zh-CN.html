<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>DeskNest 0.16.6</title>
<h1>DeskNest 0.16.6</h1>
<p>更新通道：stable；构建版本：0.16.6.65535；Windows x64。</p>
<ul><li>修复外观设置遇到刷新时背景图片未保存、再次打开后消失的问题。</li>
<li>刷新时保留未变化的 Box，减少无关盒子闪烁并保留映射文件夹导航。</li>
<li>改善 Box 拖动和调整大小的流畅度，统一普通盒子与映射文件夹的毛玻璃表现。</li>
<li>Windows 11 Acrylic 支持跟随系统和自定义外观，安装包内置所需运行库；Win10 保留原有材质路径。</li>
<li>修复映射文件夹导航菜单和断开显示器后的布局保护；保留用户数据及预览取消回滚。</li></ul></html>
