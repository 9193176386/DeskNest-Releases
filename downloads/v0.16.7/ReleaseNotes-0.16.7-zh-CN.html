<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>DeskNest 0.16.7</title>
<h1>DeskNest 0.16.7</h1>
<p>更新通道：stable；构建版本：0.16.7.65535；Windows x64。</p>
<ul><li>修复 Windows 11 关机或重启时的窗口生命周期问题，避免退出崩溃。</li>
<li>设置中心采用扁平化界面，支持平滑收缩侧栏，保持菜单图标位置并改善打开时的闪烁。</li>
<li>修复 Box 滚轮偶发滚动缓慢和截图触发的重复样式刷新，滚动条支持淡入淡出。</li>
<li>改善 Windows 11 原生右键菜单和托盘菜单的显示与交互，Box 文字保持白色。</li>
<li>精简未使用的机器学习运行库与 Qt 翻译文件，升级时清理对应旧文件并保留用户数据。</li></ul></html>
