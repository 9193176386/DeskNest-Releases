<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>DeskNest 0.18.3</title>
<h1>DeskNest 0.18.3</h1>
<p>更新通道：stable；构建版本：0.18.3.65535；Windows x64。</p>
<ul><li>修复退出后桌面图标可能不显示的问题：退出前停止桌面重挂接，并验证图标显示区域已恢复。</li>
<li>修复 Windows 11 原生菜单长时间闲置后过早超时并回退旧菜单的问题，改善取消、清理和重试时序；Windows 10 菜单路径保持不变。</li>
<li>简化安全与恢复设置，明确区分软件设置与布局备份、桌面文件备份和布局历史。</li>
<li>打开备份或恢复操作不再隐式保存其他页面尚未确认的设置，升级继续保留用户配置和数据。</li></ul></html>
